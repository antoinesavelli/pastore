[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fucone"
version = "0.0.0"
description = "Night-shift GPU job queue for the workstation."
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
fucone = "fucone.cli:main"

[tool.setuptools.packages.find]
include = ["fucone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "TID", "S602", "S604", "S605", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["build", ".venv"]
