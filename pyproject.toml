[project]
name = "pastore"
version = "0.0.0"
description = "A priority gateway and background job dispatcher for two Ollama hosts, written by directing AI coding agents: requests are served in order of source, and only owner-listed task+model pairs run, each on a host where the model fits."
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "aiohttp==3.14.5"]

[project.scripts]
pastore = "pastore.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "TID", "S602", "S604", "S605", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pastore", "deploy"]
